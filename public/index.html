<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ProxiMed GH — Staging</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <style>
    body { margin: 0; font-family: sans-serif; }
    #map { height: 100vh; width: 100%; }
    #status {
      position: absolute; top: 10px; left: 50px; z-index: 1000;
      background: white; padding: 8px 14px; border-radius: 6px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3); font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="status">Loading hospitals from API...</div>
  <div id="map"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script>
    // Base map centered on Accra, Ghana
    const map = L.map('map').setView([5.6037, -0.1870], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const statusEl = document.getElementById('status');

    // Call the Node/Express API, which queries PostGIS
    fetch('/api/hospitals')
      .then(res => {
        if (!res.ok) throw new Error('API responded with ' + res.status);
        return res.json();
      })
      .then(hospitals => {
        statusEl.textContent = `Loaded ${hospitals.length} hospitals from PostGIS`;
        hospitals.forEach(h => {
          L.marker([h.lat, h.lng])
            .addTo(map)
            .bindPopup(`<b>${h.name}</b><br>Beds: ${h.bed_capacity}<br>${h.specialties}`);
        });
      })
      .catch(err => {
        statusEl.textContent = 'API/database query failed: ' + err.message;
        statusEl.style.color = 'red';
        console.error(err);
      });
  </script>
</body>
</html>
